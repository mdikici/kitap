<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kitaplık Arama</title>
<style>
  :root { --accent: #0a7cff; --bg: #f5f5f7; --card: #ffffff; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: #1c1c1e; }
  header { background: var(--accent); color: #fff; padding: 18px 16px; }
  header h1 { font-size: 20px; }
  .container { max-width: 800px; margin: 0 auto; padding: 16px; }
  #search { width: 100%; padding: 14px 16px; font-size: 17px; border: 1px solid #d1d1d6; border-radius: 12px; outline: none; }
  #search:focus { border-color: var(--accent); }
  #count { margin: 10px 4px; color: #6e6e73; font-size: 14px; }
  table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 12px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid #eee; font-size: 15px; }
  th { background: #fafafa; font-weight: 600; }
  tr:last-child td { border-bottom: none; }
  #status { text-align: center; padding: 40px 0; color: #6e6e73; }
  .error { color: #ff3b30; }
</style>
</head>
<body>
<header><h1>📚 Kitaplık Arama</h1></header>
<div class="container">
  <input id="search" type="search" placeholder="Kitaplıkta ara…" autocomplete="off" autofocus>
  <div id="count"></div>
  <div id="status">Yükleniyor…</div>
  <table id="table" hidden>
    <thead><tr id="thead-row"></tr></thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<script>
//const SHEET_ID = "13W2KbnTpBdBakHXFjT94t1rEtcbaP_OqYNPHvQbiiSg";
//const API_KEY  = "AIzaSyBilKRpmmTp_B60SuoY59lZDnWrCO4Sm0M";       // Google Cloud'dan aldığın anahtar
const RANGE    = "kitaplık!A1:Z1000";    // sekme adı Türkçe karakter içerebilir

const statusEl = document.getElementById("status");
const countEl  = document.getElementById("count");
const tableEl  = document.getElementById("table");
const theadRow = document.getElementById("thead-row");
const tbody    = document.getElementById("tbody");
const searchEl = document.getElementById("search");

let headers = [], rows = [];

// Türkçe uyumlu normalize (I/ı, İ/i, ş/Ş, ğ/Ğ…)
const norm = s => s.toLocaleLowerCase("tr").replace(/ı/g, "i").normalize("NFD").replace(/[\u0300-\u036f]/g, "");

function render() {
  const q = norm(searchEl.value.trim());
  const filtered = q ? rows.filter(r => r.some(c => norm(c).includes(q))) : rows;
  countEl.textContent = q ? `${filtered.length} sonuç bulundu` : `${rows.length} kayıt`;
  tbody.innerHTML = filtered.map(r =>
    "<tr>" + headers.map((_, i) => `<td>${escapeHtml(r[i] || "")}</td>`).join("") + "</tr>"
  ).join("");
}

const escapeHtml = s => s.replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function load() {
  try {
    // const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(RANGE)}?key=${API_KEY}`;
    const url = `https://script.google.com/macros/s/AKfycbw1tKV-xVDJlA2hLhCk0VeVpsEx7HOKpY74hGFv49k4Rce9wI3uTF6qQ1UMm9eTUBLz/exec`;

    const res = await fetch(url);
    //if (!res.ok) throw new Error(`API hatası: ${res.status}`);
    if (!res.ok) throw new Error(`Sunucu hatası: ${res.status}`);
    const data = await res.json();
    //if (!data.values?.length) throw new Error("Sayfa boş görünüyor.");
    if (!data.length) throw new Error("Sayfa boş görünüyor.");
    headers = data[0];
    rows    = data.slice(1);
    theadRow.innerHTML = headers.map(h => `<th>${escapeHtml(h)}</th>`).join("");
    statusEl.hidden = true;
    tableEl.hidden  = false;
    render();
  } catch (err) {
    statusEl.textContent = "Veri alınamadı: " + err.message;
    statusEl.classList.add("error");
  }
}

searchEl.addEventListener("input", render);
load();
</script>
</body>
</html>
