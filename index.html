<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kitaplık Arama</title>
<style>
  :root { --accent: #0a7cff; --bg: #f5f5f7; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: #1c1c1e; }
  header { background: var(--accent); color: #fff; padding: 18px 16px; }
  header h1 { font-size: 20px; }
  .container { max-width: 800px; margin: 0 auto; padding: 16px; }
  #search { width: 100%; padding: 14px 16px; font-size: 17px; border: 1px solid #d1d1d6; border-radius: 12px; outline: none; }
  #search:focus { border-color: var(--accent); }
  #count { margin: 10px 4px; color: #6e6e73; font-size: 14px; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid #eee; font-size: 15px; word-break: break-word; }
  th { background: #fafafa; font-weight: 600; }
  tr:last-child td { border-bottom: none; }
  #status { text-align: center; padding: 40px 16px; color: #6e6e73; }
  .error { color: #ff3b30; }
  #status a { color: var(--accent); word-break: break-all; }
</style>
</head>
<body>
<header><h1>📚 Kitaplık Arama 1.02</h1></header>
<div class="container">
  <input id="search" type="search" placeholder="Kitaplıkta ara…" autocomplete="off" autofocus>
  <div id="count"></div>
  <div id="status">Yükleniyor…</div>
  <table id="table" hidden>
    <thead><tr id="thead-row"></tr></thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<script>
// ============ AYARLAR ============
const SHEET_ID = "13W2KbnTpBdBakHXFjT94t1rEtcbaP_OqYNPHvQbiiSg";
const TAB_NAME = "kitaplık";  // Dosyadaki sekme adıyla birebir aynı olmalı
// =================================

const statusEl = document.getElementById("status");
const countEl  = document.getElementById("count");
const tableEl  = document.getElementById("table");
const theadRow = document.getElementById("thead-row");
const tbody    = document.getElementById("tbody");
const searchEl = document.getElementById("search");

let headers = [], rows = [];

const TEST_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(TAB_NAME)}`;

const norm = s => s.toLocaleLowerCase("tr").replace(/ı/g, "i").normalize("NFD").replace(/[\u0300-\u036f]/g, "");

function parseCSV(text) {
  const out = [];
  let row = [], cur = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { cur += '"'; i++; }
        else inQuotes = false;
      } else cur += c;
    } else if (c === '"') inQuotes = true;
    else if (c === ",") { row.push(cur); cur = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(cur); cur = "";
      if (row.length > 1 || row[0] !== "") out.push(row), row = [];
    } else cur += c;
  }
  if (cur !== "" || row.length) { row.push(cur); out.push(row); }
  return out;
}

const escapeHtml = s => s.replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function render() {
  const q = norm(searchEl.value.trim());
  const filtered = q ? rows.filter(r => r.some(c => norm(c).includes(q))) : rows;
  countEl.textContent = q ? `${filtered.length} sonuç bulundu` : `${rows.length} kayıt`;
  tbody.innerHTML = filtered.map(r =>
    "<tr>" + headers.map((_, i) => `<td>${escapeHtml(r[i] || "")}</td>`).join("") + "</tr>"
  ).join("");
}

async function load() {
  try {
    const res = await fetch(TEST_URL);
    const text = await res.text();
    if (!res.ok || text.startsWith("<") || text.includes("google.visualization")) {
      throw new Error(`Google veriyi döndürmedi (${res.status}).`);
    }
    const data = parseCSV(text);
    if (!data.length) throw new Error("Sayfa boş görünüyor.");
    headers = data[0];
    rows    = data.slice(1);
    theadRow.innerHTML = headers.map(h => `<th>${escapeHtml(h)}</th>`).join("");
    statusEl.hidden = true;
    tableEl.hidden  = false;
    render();
  } catch (err) {
    statusEl.classList.add("error");
    statusEl.innerHTML =
      escapeHtml("Veri alınamadı: " + err.message) +
      "<br><br>Sorunun kaynağını görmek için bu linki tarayıcıda aç:<br>" +
      `<a href="${TEST_URL}" target="_blank" rel="noopener">${TEST_URL}</a>`;
  }
}

searchEl.addEventListener("input", render);
load();
</script>
</body>
</html>
